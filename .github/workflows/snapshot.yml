name: Relevé ponctuel
on:
  push:
    branches: [claude/webcams-favoris]
    paths: [tools/snapshot.sh]
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/snapshot.sh
      - run: |
          git config user.name "fondeur-bot"; git config user.email "fondeur-bot@users.noreply.github.com"
          git add _snapshots; git commit -m "Relevé ponctuel" || true; git push
